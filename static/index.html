<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zebra Label Printer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://icomb.place/design-system/verdant-tokens.css">
<link rel="stylesheet" href="https://icomb.place/design-system/verdant-base.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--vui-font-sans);
    background: var(--vui-bg-deep);
    color: var(--vui-text);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 48px 20px;
  }

  h1 {
    font-size: var(--vui-text-2xl);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: var(--vui-sp-8);
    color: var(--vui-accent);
  }

  /* Drop zone */
  #drop-zone {
    width: 500px; min-height: 220px;
    padding: var(--vui-sp-8);
    border: 2px dashed var(--vui-border-hover);
    border-radius: var(--vui-radius-xl);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: var(--vui-sp-3);
    cursor: pointer;
    transition: all var(--vui-duration-fast) var(--vui-ease);
    background: var(--vui-surface);
  }
  #drop-zone:hover { border-color: var(--vui-accent-border); background: var(--vui-surface-hover); }
  #drop-zone.dragover { border-color: var(--vui-accent); background: var(--vui-accent-dim); border-style: solid; }
  #drop-zone p { color: var(--vui-text); font-size: var(--vui-text-base); pointer-events: none; font-weight: 500; }
  #drop-zone .icon { font-size: 40px; pointer-events: none; color: var(--vui-accent); opacity: 0.7; }
  #drop-zone .hint { color: var(--vui-text); font-size: var(--vui-text-xs); pointer-events: none; opacity: 0.7; }
  #file-input { display: none; }

  /* Preview area */
  #preview-area {
    margin-top: var(--vui-sp-6);
    display: none; flex-direction: column; align-items: center; gap: 0;
  }
  #file-name {
    font-size: var(--vui-text-xs);
    color: var(--vui-text-dim);
    margin-bottom: var(--vui-sp-3);
    font-family: var(--vui-font-mono);
  }

  /* Printer body */
  .printer-wrapper { position: relative; width: 340px; }

  .printer-body {
    width: 340px; height: 130px;
    background: var(--vui-surface);
    border: 1px solid var(--vui-border);
    border-radius: var(--vui-radius-lg) var(--vui-radius-lg) var(--vui-radius-md) var(--vui-radius-md);
    position: relative; z-index: 2;
    box-shadow: var(--vui-shadow-md);
  }
  .printer-body::before {
    content: ''; position: absolute; top: 10px; left: 20px; right: 20px; height: 36px;
    background: var(--vui-bg-deep);
    border: 1px solid var(--vui-border);
    border-radius: var(--vui-radius-sm);
  }
  .printer-body::after {
    content: 'ZD621'; position: absolute; bottom: 14px; right: 20px;
    color: var(--vui-text-dim); font-size: var(--vui-text-xs);
    font-weight: 600; letter-spacing: 1px;
    font-family: var(--vui-font-mono);
  }

  .printer-stripes {
    position: absolute; top: 54px; left: 20px; display: flex; gap: 3px;
  }
  .printer-stripes span {
    display: block; width: 4px; height: 18px;
    background: var(--vui-border-hover); border-radius: 1px;
    transform: skewX(-10deg);
  }

  .printer-led {
    position: absolute; top: 58px; right: 24px;
    width: 8px; height: 8px;
    background: var(--vui-accent);
    border-radius: var(--vui-radius-full);
    box-shadow: 0 0 8px var(--vui-accent-glow);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%,90%,100% { opacity: 1; } 95% { opacity: 0.3; } }

  .printer-slot {
    width: 300px; height: 6px;
    background: var(--vui-bg-deep);
    border: 1px solid var(--vui-border);
    border-top: none;
    margin: 0 auto;
    position: relative; z-index: 2;
  }

  .label-output {
    width: 280px; margin: 0 auto;
    position: relative; z-index: 1;
    overflow: hidden;
  }
  .label-output img {
    width: 100%; display: block; padding: 0; margin: 0;
    border: 1px solid var(--vui-border);
    border-top: none;
    border-radius: 0 0 var(--vui-radius-sm) var(--vui-radius-sm);
    background: #fff;
    animation: slideOut 0.5s var(--vui-ease);
  }
  @keyframes slideOut {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Buttons */
  .btn-row { display: flex; gap: 12px; margin-top: 16px; }

  button {
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 600;
    font-family: var(--vui-font-sans);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  #print-btn { background: #4CAF50; color: #fff; }
  #print-btn:hover { background: #388E3C; }
  #print-btn:disabled { background: #aaa; cursor: not-allowed; }

  #clear-btn { background: #eee; color: #333; }
  #clear-btn:hover { background: #ddd; }

  /* Status */
  #status {
    margin-top: var(--vui-sp-3);
    font-size: var(--vui-text-xs);
    min-height: 1.4em;
    font-family: var(--vui-font-mono);
  }
  #status.success { color: var(--vui-accent); }
  #status.error { color: var(--vui-danger); }
  #status.loading { color: var(--vui-info); }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--vui-info);
    border-top-color: transparent;
    border-radius: var(--vui-radius-full);
    animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: var(--vui-sp-1);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>Zebra Label Printer</h1>

<div id="drop-zone">
  <div class="icon">&#128206;</div>
  <p>Drop a file here to print</p>
  <span class="hint">PDF, Word, PNG, JPG, BMP, TIFF</span>
</div>
<input type="file" id="file-input" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.bmp,.tiff,.tif,.webp">

<div id="preview-area">
  <span id="file-name"></span>
  <div class="printer-wrapper">
    <div class="printer-body">
      <div class="printer-stripes">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="printer-led"></div>
    </div>
    <div class="printer-slot"></div>
    <div class="label-output">
      <img id="preview-img" alt="Label preview">
    </div>
  </div>
  <div class="btn-row">
    <button id="print-btn">Print</button>
    <button id="clear-btn">Clear</button>
  </div>
  <div id="status"></div>
</div>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const previewArea = document.getElementById('preview-area');
const previewImg = document.getElementById('preview-img');
const fileName = document.getElementById('file-name');
const printBtn = document.getElementById('print-btn');
const clearBtn = document.getElementById('clear-btn');
const status = document.getElementById('status');

let currentFile = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (files.length) handleFile(files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

async function handleFile(file) {
  currentFile = file;
  fileName.textContent = file.name;
  setStatus('loading', '<span class="spinner"></span>Generating preview...');
  previewArea.style.display = 'flex';
  printBtn.disabled = true;

  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch('/api/preview', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) { setStatus('error', data.error); return; }
    previewImg.src = data.image;
    printBtn.disabled = false;
    setStatus('', '');
  } catch (e) {
    setStatus('error', 'Failed to generate preview');
  }
}

printBtn.addEventListener('click', async () => {
  if (!currentFile) return;
  printBtn.disabled = true;
  setStatus('loading', '<span class="spinner"></span>Printing...');

  const form = new FormData();
  form.append('file', currentFile);

  try {
    const res = await fetch('/api/print', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) { setStatus('error', 'Print failed: ' + data.error); }
    else { setStatus('success', 'Sent to ' + data.printer + ' (' + data.ip + ')'); }
  } catch (e) {
    setStatus('error', 'Print failed: connection error');
  }
  printBtn.disabled = false;
});

clearBtn.addEventListener('click', () => {
  currentFile = null;
  previewArea.style.display = 'none';
  previewImg.src = '';
  fileInput.value = '';
  setStatus('', '');
});

function setStatus(cls, html) {
  status.className = cls;
  status.innerHTML = html;
}
</script>
</body>
</html>
